// The serialization plugin is not on the root buildscript classpath, and the generated
// android/ project is gitignored, so it has to be declared here instead — this file is the
// module's own source and survives `expo prebuild --clean`.
// kotlinVersion is set by the expo-root-project plugin, so it stays aligned with kotlin-android.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-serialization:${rootProject.ext.kotlinVersion}"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

group = 'com.ziro.relay'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
  namespace 'com.ziro.relay.module'
  compileSdk 35

  defaultConfig {
    minSdk 26
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  // The radio. The ONLY reason this module exists.
  implementation 'com.google.android.gms:play-services-nearby:19.3.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
  implementation 'androidx.core:core-ktx:1.15.0'
  implementation 'androidx.sqlite:sqlite-ktx:2.4.0'
  implementation 'androidx.security:security-crypto:1.1.0-alpha06'
  implementation 'androidx.work:work-runtime-ktx:2.10.0'

  // Required for ActivityResultContracts.RequestMultiplePermissions and registerForActivityResult.
  // activity-ktx pulls both the core activity classes and the activity-result package that
  // hosts ActivityResultContracts; react-android's transitive activity is at implementation
  // scope so we redeclare at 1.8.2 (a known-good version that exports the contracts API on
  // this Gradle 8.14.3 + AGP combination).
  implementation 'androidx.activity:activity-ktx:1.8.2'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
}
