# Configuración SDD del proyecto Replica (Platanus Hack 26 Bogotá — team-7)
schema: spec-driven

context: |
  Stack backend: Python 3.12 · SQLAlchemy 2.0 (models layer en backend/app/models) · FastAPI + PostgreSQL (psycopg 3) como objetivo.
  Móvil: React Native (Expo dev build) + módulos nativos Kotlin (Nearby Connections). Web: estática con MapLibre GL + deck.gl sobre celdas H3.
  Fuente de verdad de decisiones: openspec/DECISIONS.md — leer antes de proponer o implementar nada.
  Specs técnicos por tema: openspec/*.md (protocol, communication, ledger, storage, orphan-device, api, architecture).
  Convenciones: documentación y specs en español; commits convencionales (docs:, feat:, …); rama actual feature/web-module.
  Invariantes críticas: Nearby vive SOLO en los teléfonos (nunca en el backend); sin llamadas HTTP entre módulos internos del backend;
  coordenadas exactas y sid jamás exponen por endpoint público ni llegan al LLM; protocolo store-and-forward + gossip (NO mesh routing IP).
  Testing: sin framework configurado aún (strict_tdd: false).

rules:
  proposal:
    - Incluir plan de rollback para cambios riesgosos
    - Verificar contra openspec/DECISIONS.md que la idea no fue ya rechazada
  specs:
    - Usar Given/When/Then para escenarios
    - Usar palabras clave RFC 2119 (DEBE/MUST, DEBE NO/SHALL NOT, PUEDE/MAY)
    - Escribir en español neutro/profesional, siguiendo el registro de openspec/*.md
  design:
    - Documentar decisiones de arquitectura con racional (y registrarlas en DECISIONS.md)
    - Incluir diagramas de secuencia para flujos complejos (gateway, sync, verificación SAFE)
  tasks:
    - Agrupar por fase, numeración jerárquica
    - Tareas completables en una sesión
  apply:
    guidelines:
      - Seguir los patrones existentes en backend/app (SQLAlchemy 2.0 declarative)
      - Respetar las constantes de dominio de AGENTS.md (TTL 8 hops, ledger 24h/5MB, máx 3 conexiones, HMAC-SHA256)
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Advertir antes de fusionar deltas destructivos
